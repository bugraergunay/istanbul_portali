<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstanbul Portalı - Canlı Döviz Çevirici</title>
    <style>
        /* Genel Sayfa ve Arka Plan Tasarımı */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Döviz Çevirici Kart Tasarımı */
        .doviz-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 350px;
            text-align: center;
        }

        .doviz-box h3 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            letter-spacing: 0.5px;
            color: #00adb5;
        }

        /* Giriş ve Seçim Alanları */
        .input-group, .select-group div {
            display: flex;
            flex-direction: column;
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-size: 13px;
            color: #b2bec3;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input, select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #00adb5;
            box-shadow: 0 0 8px rgba(0, 173, 181, 0.4);
        }

        /* Seçim Kutularını Yan Yana Getirme */
        .select-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .select-group div {
            flex: 1;
        }

        select option {
            background: #222831;
            color: #fff;
        }

        /* Sonuç Kutusu */
        .result-box {
            background: rgba(0, 173, 181, 0.1);
            border-left: 4px solid #00adb5;
            padding: 15px;
            border-radius: 4px;
            margin-top: 25px;
        }

        #resultText {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #00adb5;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="doviz-box">
        <h3>Canlı Döviz Çevirici</h3>
        
        <div class="input-group">
            <label for="amount">Miktar:</label>
            <input type="number" id="amount" value="1" min="1">
        </div>

        <div class="select-group">
            <div>
                <label for="fromCurrency">Satan:</label>
                <select id="fromCurrency">
                    <option value="try" selected>TRY (Türk Lirası)</option>
                    <option value="usd">USD (Amerikan Doları)</option>
                    <option value="eur">EUR (Euro)</option>
                    <option value="gbp">GBP (İngiliz Sterlini)</option>
                </select>
            </div>
            
            <div>
                <label for="toCurrency">Alan:</label>
                <select id="toCurrency">
                    <option value="usd" selected>USD (Amerikan Doları)</option>
                    <option value="try">TRY (Türk Lirası)</option>
                    <option value="eur">EUR (Euro)</option>
                    <option value="gbp">GBP (İngiliz Sterlini)</option>
                </select>
            </div>
        </div>

        <div class="result-box">
            <p id="resultText">Hesaplanıyor...</p>
        </div>
    </div>

    <script>
        const amountInput = document.getElementById('amount');
        const fromCurrencySelect = document.getElementById('fromCurrency');
        const toCurrencySelect = document.getElementById('toCurrency');
        const resultText = document.getElementById('resultText');

        // Canlı Kurları Çeken ve Hesaplayan Fonksiyon
        async function dovizCevir() {
            const miktar = parseFloat(amountInput.value);
            const kaynakDoviz = fromCurrencySelect.value;
            const hedefDoviz = toCurrencySelect.value;

            // Miktar kontrolü
            if (isNaN(miktar) || miktar <= 0) {
                resultText.innerText = "Geçerli miktar girin.";
                return;
            }

            // Aynı para birimleri seçildiyse direkt yazdır
            if (kaynakDoviz === hedefDoviz) {
                resultText.innerText = `${miktar.toFixed(2)} ${kaynakDoviz.toUpperCase()} = ${miktar.toFixed(2)} ${hedefDoviz.toUpperCase()}`;
                return;
            }

            try {
                resultText.innerText = "Güncelleniyor...";

                // %100 HTTPS Uyumlu, API Anahtarı İstemeyen Güvenli Merkez Bankası Verisi
                const url = `https://open.er-api.com/v6/latest/${kaynakDoviz.toUpperCase()}`;
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error("Kur verisi alınamadı.");
                }

                const data = await response.json();
                const kurOrani = data.rates[hedefDoviz.toUpperCase()];
                
                if (!kurOrani) {
                    throw new Error("Para birimi oranı bulunamadı.");
                }

                // Hesaplama ve Formatlama
                const toplamSonuc = miktar * kurOrani;

                resultText.innerText = `${miktar.toLocaleString('tr-TR')} ${kaynakDoviz.toUpperCase()} = ${toplamSonuc.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ${hedefDoviz.toUpperCase()}`;

            } catch (error) {
                console.error("Hata:", error);
                resultText.innerText = "Bağlantı hatası!";
            }
        }

        // Dinleyicileri Tanımlama (Kullanıcı veri değiştirdikçe anlık hesaplar)
        amountInput.addEventListener('input', dovizCevir);
        fromCurrencySelect.addEventListener('change', dovizCevir);
        toCurrencySelect.addEventListener('change', dovizCevir);

        // Sayfa açıldığında ilk hesabı yapması için tetikleme
        window.addEventListener('DOMContentLoaded', dovizCevir);
    </script>
</body>
</html>
