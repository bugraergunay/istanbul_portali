<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstanbul Tanıtım Portalı | Buğra Ergünay</title>
    <style>
        /* [MEVCUT CSS'İNİ KORUDUM] */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        :root { --bg-main: #0b0c10; --text-main: #fff; --card-bg: rgba(255, 255, 255, 0.02); --card-border: rgba(255, 255, 255, 0.05); --ibb-blue: #0d2c54; }
        body { background-color: var(--bg-main); color: var(--text-main); }
        
        /* DÖVİZ ENTEGRASYON STİLİ */
        .ticker-wrap { width: 100%; background: rgba(255, 204, 0, 0.06); padding: 15px; text-align: center; border-bottom: 1px solid rgba(255, 204, 0, 0.15); }
        .converter-panel { max-width: 500px; margin: 10px auto; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; display: flex; gap: 10px; align-items: center; justify-content: center; }
        .converter-panel input, .converter-panel select { padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
        .converter-result { color: #00e5ff; font-weight: bold; min-width: 150px; }
    </style>
</head>
<body>

    <div class="ticker-wrap">
        <h3 style="color: #ffcc00; margin-bottom: 10px; font-size: 0.9rem;">CANLI DÖVİZ ÇEVİRİCİ</h3>
        <div class="converter-panel">
            <input type="number" id="convAmount" value="1" min="1" oninput="calculateConversion()">
            <select id="fromCurrency" onchange="calculateConversion()">
                <option value="try">TRY</option>
                <option value="usd">USD</option>
                <option value="eur">EUR</option>
            </select>
            <span style="color:#fff;"> ➡️ </span>
            <select id="toCurrency" onchange="calculateConversion()">
                <option value="usd">USD</option>
                <option value="try">TRY</option>
                <option value="eur">EUR</option>
            </select>
            <div class="converter-result" id="convResult">Hesaplanıyor...</div>
        </div>
    </div>

    <script>
        // DÖVİZ MOTORU
        async function calculateConversion() {
            const amount = document.getElementById('convAmount').value;
            const from = document.getElementById('fromCurrency').value;
            const to = document.getElementById('toCurrency').value;
            const resultDiv = document.getElementById('convResult');

            if (!amount || amount <= 0) return;

            try {
                const url = `https://open.er-api.com/v6/latest/${from.toUpperCase()}`;
                const response = await fetch(url);
                const data = await response.json();
                const rate = data.rates[to.toUpperCase()];
                const total = amount * rate;
                resultDiv.innerText = `${total.toFixed(2)} ${to.toUpperCase()}`;
            } catch (e) {
                resultDiv.innerText = "Hata!";
            }
        }
        
        // Sayfa açıldığında otomatik hesapla
        window.onload = calculateConversion;
    </script>
</body>
</html>
